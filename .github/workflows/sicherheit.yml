name: Sicherheitsprüfung
# Prüft wöchentlich (montags früh) und bei Änderungen an den Paketen, ob eines der verwendeten Python-Pakete eine bekannte Sicherheitslücke hat.
# Schlägt die Prüfung fehl, schickt GitHub eine Mail: dann das genannte Paket in markentrix-server/portal/requirements.txt anheben,
# bash tests/run.sh laufen lassen und per mkctl update einspielen.
on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [server-paket, main]
    paths:
      - "markentrix-server/portal/requirements.txt"
      - "markentrix-server/portal/Dockerfile"
      - ".github/workflows/sicherheit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pakete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (bekannte Sicherheitslücken in den Paketen)
        run: |
          pip install -q pip-audit
          pip-audit -r markentrix-server/portal/requirements.txt --strict --progress-spinner off
  geheimnisse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auf versehentlich eingecheckte Schlüssel und Passwörter prüfen (gitleaks)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gl.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
