name: Tests
# Läuft bei jedem Push auf server-paket/main und bei Pull Requests. Gleiche Prüfungen wie "bash tests/run.sh" (Volltest, rund 30 bis 45 Minuten).
on:
  push:
    branches: [server-paket, main]
  pull_request:
  workflow_dispatch:
jobs:
  portal:
    runs-on: ubuntu-latest
    container: ubuntu:24.04   # läuft als root, damit der Testlauf eine eigene Test-Datenbank starten kann
    timeout-minutes: 90
    steps:
      - name: Programme installieren
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl psmisc procps postgresql postgresql-client poppler-utils python3 python3-pip nodejs npm shellcheck >/dev/null
      - uses: actions/checkout@v4
      - name: Shell-Skripte prüfen
        run: |
          cd markentrix-server
          for f in install.sh bin/*.sh bin/mkctl; do bash -n "$f"; done
          shellcheck -S warning install.sh bin/*.sh bin/mkctl
      - name: Abhängigkeiten
        run: pip3 install --break-system-packages -q -r markentrix-server/portal/requirements.txt aiosmtpd httpx pyflakes playwright pypdf
      - name: Browser für die Oberflächentests
        run: python3 -m playwright install --with-deps chromium >/dev/null
      - name: Pfad wie auf dem Entwicklungsrechner (einige Tests lesen Dateien dort)
        run: |
          mkdir -p /home/claude
          ln -sfn "$GITHUB_WORKSPACE/markentrix-server" /home/claude/markentrix-server
      - name: Tests
        run: |
          bash markentrix-server/tests/run.sh > /tmp/testlauf.txt 2>&1 < /dev/null; rc=$?
          cat /tmp/testlauf.txt
          exit $rc
        shell: bash
      - name: Fehlerdetails als Hinweis ausgeben
        if: failure()
        shell: bash
        run: |
          T=$(tail -c 3000 /tmp/testlauf.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Testlauf::$T"
          L=$(tail -c 1500 /var/tmp/pt/log 2>/dev/null | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Portal-Log::$L"
      - name: Ausgaben der Tests sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-ausgaben
          path: /var/tmp/pt/out_*.txt
