name: Markentrix-Tests
# Läuft bei jedem Push auf server-paket und bei Pull Requests. Gleiche Prüfungen wie "bash tests/run.sh" (rund 30 bis 45 Minuten).
on:
  push:
    branches: [server-paket]
  pull_request:
  workflow_dispatch:

jobs:
  schnell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell-Skripte prüfen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          cd markentrix-server
          for f in install.sh bin/*.sh bin/mkctl; do bash -n "$f"; done
          shellcheck -S warning install.sh bin/*.sh bin/mkctl
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python prüfen (pyflakes)
        run: |
          pip install pyflakes
          python -m pyflakes markentrix-server/portal/app

  volltest:
    needs: schnell
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: PostgreSQL 16 bereitstellen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16 fonts-liberation
          sudo systemctl stop postgresql || true
      - name: Python-Pakete und Browser
        run: |
          python -m pip install -r markentrix-server/portal/requirements.txt aiosmtpd httpx pyflakes playwright pypdf
          sudo mkdir -p /opt/pw && sudo chmod 777 /opt/pw
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw python -m playwright install --with-deps chromium
          echo "PLAYWRIGHT_BROWSERS_PATH=/opt/pw" >> "$GITHUB_ENV"
      - name: Pfad wie auf dem Entwicklungsrechner (einige Tests lesen Dateien dort)
        run: |
          sudo mkdir -p /home/claude
          sudo ln -sfn "$GITHUB_WORKSPACE/markentrix-server" /home/claude/markentrix-server
      - name: Volltest
        run: sudo env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=/opt/pw" bash markentrix-server/tests/run.sh | tee /tmp/ergebnis.txt; grep -q "ALLES OK" /tmp/ergebnis.txt
      - name: Ausgaben der Tests sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-ausgaben
          path: /var/tmp/pt/out_*.txt
