name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt
      - name: Server- und Generator-Tests
        run: python3 -W ignore -m unittest discover -s tests -p 'test_*.py'
      - name: Website bauen
        run: python3 build/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser-Tests (Desktop und Mobil, Barrierefreiheit)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist/
          retention-days: 14
