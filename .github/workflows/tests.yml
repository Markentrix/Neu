# Führt die Testsuite bei jedem Push aus. Ein roter Haken heißt: diese Version nicht installieren.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, mbstring, curl, intl
          coverage: none
      - name: Syntax prüfen
        run: find app public tools tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Testsuite
        run: php tests/run.php
