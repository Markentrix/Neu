name: Tests
on:
  push:
    branches: [server-paket, main]
  pull_request:
jobs:
  portal:
    runs-on: ubuntu-latest
    container: ubuntu:24.04   # läuft als root, damit der Testlauf eine eigene Test-Datenbank starten kann
    timeout-minutes: 25
    steps:
      - name: Programme installieren
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl psmisc procps postgresql postgresql-client python3 python3-pip nodejs >/dev/null
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: pip3 install --break-system-packages -q -r markentrix-server/portal/requirements.txt aiosmtpd httpx pyflakes
      - name: Tests
        run: bash markentrix-server/tests/run.sh
