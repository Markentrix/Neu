# Prüft bei jedem Push, ob website-fertig/ alle Regeln des Markentrix-Portals erfüllt und im Browser funktioniert.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom
          coverage: none
      - name: Syntax prüfen
        run: find app tools tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Upload-Regeln, SEO, Formulare
        run: php tests/run.php
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser-Test (Buchung, Kontakt, Gutschein, Ausfall, 390 px)
        run: |
          php tools/build.php
          npm install --no-save --prefix /tmp/pw playwright@1.56.1
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/pw/node_modules node tests/browser.cjs
