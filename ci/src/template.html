<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Markentrix · Corporate Identity 2026 · v2.0</title>
<style>
@font-face{font-family:'Space Grotesk';font-weight:500;src:url(fonts/space-grotesk-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:600;src:url(fonts/space-grotesk-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:700;src:url(fonts/space-grotesk-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:400;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;src:url(fonts/inter-latin-700-normal.woff2) format('woff2')}
:root{--black:#05070B;--navy:#0B1020;--cyan:#28C7F7;--blue:#1E9BFF;--violet:#8B5CF6;--magenta:#D85CFF;--white:#fff;--soft:#F8FAFC;--cool:#B8C0CC;--muted:#667085;--text:#2C3446;--tblue:#003E8A;--tviolet:#4C1D95;--ok:#15803D;--warn:#B45309;--danger:#B91C1C;--hair:#E3E7ED;
--sig:linear-gradient(110deg,#28C7F7 0%,#1E9BFF 55%,#8B5CF6 100%);--cta:linear-gradient(110deg,#28C7F7 0%,#1E9BFF 100%);
--fh:'Space Grotesk',sans-serif;--fb:'Inter',sans-serif}
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--fb);font-size:11px;line-height:1.5;color:var(--text);-webkit-print-color-adjust:exact;print-color-adjust:exact;font-feature-settings:'tnum' 1,'cv11' 1}
.page{width:794px;height:1123px;padding:44px 60px 0;position:relative;background:var(--soft);overflow:hidden;page-break-after:always;break-after:page}
.ph{display:flex;align-items:center;gap:16px;font-size:8.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);height:14px}
.ph i{flex:1;height:1px;background:var(--hair)}
.ph b{font-weight:500}
.ph:after{content:'';width:64px;height:3px;border-radius:2px;background:var(--sig)}
.pf{position:absolute;left:60px;right:60px;bottom:28px;padding-top:10px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;font-size:8.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pc{padding-top:34px}
h1{font-family:var(--fh);font-weight:700;font-size:35px;line-height:1.08;letter-spacing:-.02em;color:var(--navy);margin:0 0 10px}
h2{font-family:var(--fh);font-weight:600;font-size:16px;line-height:1.25;letter-spacing:-.01em;color:var(--navy);margin:0 0 8px}
h3{font-family:var(--fh);font-weight:600;font-size:12.5px;line-height:1.3;color:var(--navy);margin:0 0 4px}
.lead{font-size:13px;line-height:1.5;color:var(--text);max-width:600px;margin:0 0 22px}
p{margin:0 0 6px}
.mk{box-shadow:inset 0 -.3em 0 rgba(40,199,247,.42)}
.card{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:15px 17px}
.card.soft{background:#F1F5FA}
.card.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.card.navy h2,.card.navy h3{color:#fff}
.g2,.g3,.g4,.g5{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb0{margin-bottom:0}
.lab{font-size:8.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:block}
.lab.b{color:var(--tblue)}
ul{margin:0;padding:0;list-style:none}
ul li{position:relative;padding-left:13px;margin-bottom:4.5px}
ul li:before{content:'';position:absolute;left:0;top:.52em;width:5px;height:5px;border-radius:50%;background:var(--cyan)}
ul.v li:before{background:var(--violet)}
ul.no li:before{content:'×';background:none;color:var(--danger);font-weight:700;top:-.08em;width:auto;height:auto;font-size:12px}
ul.yes li:before{content:'✓';background:none;color:var(--ok);font-weight:700;top:-.05em;width:auto;height:auto;font-size:10px}
ul.tight li{margin-bottom:2.5px}
table.t{width:100%;border-collapse:collapse;font-size:10px;line-height:1.35}
table.t th{text-align:left;font-size:8px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 8px 6px 0;border-bottom:1px solid var(--hair);vertical-align:bottom}
table.t td{padding:6px 8px 6px 0;border-bottom:1px solid var(--hair);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td b,b{font-weight:600;color:var(--navy)}
.card.navy b{color:#fff}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.5px}
.neu,.offen{display:inline-block;font-size:7.5px;font-weight:700;letter-spacing:.08em;padding:1.5px 5px;border-radius:4px;vertical-align:.15em;margin-left:5px;font-family:var(--fb)}
.neu{background:#E6F7FE;color:var(--tblue)}
.offen{background:#FEF3E2;color:var(--warn)}
.sw{height:54px;border-radius:9px;border:1px solid rgba(11,16,32,.06);margin-bottom:8px}
.small{font-size:9.5px;color:var(--muted);line-height:1.45}
.num{font-family:var(--fh);font-weight:700;font-size:10px;color:var(--tblue);letter-spacing:.04em}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--danger);font-weight:700}
.stage{background:#fff;border:1px solid var(--hair);border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.stage.dk{background:var(--navy);border-color:var(--navy)}
.cap{font-size:9.5px;color:var(--muted);margin-top:6px}
.btn{display:inline-flex;align-items:center;white-space:nowrap;height:36px;padding:0 16px;border-radius:10px;font-weight:600;font-size:12px;color:var(--navy);background:var(--cta)}
.btn.sec{background:#fff;border:1px solid var(--cool)}
.btn.ter{background:none;padding:0;color:var(--tblue)}
.prompt{background:#0B1020;color:#E8EEF7;border-radius:12px;padding:13px 15px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.7px;line-height:1.55;white-space:pre-wrap}
.prompt em{color:#28C7F7;font-style:normal}
.bar{height:9px;border-radius:5px;background:#EEF2F7;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.dim{position:absolute;font-size:8.5px;font-weight:600;color:var(--tblue);font-family:var(--fb)}
.x{position:relative}
.x:after{content:'×';position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;font-size:11px;font-weight:700;line-height:16px;text-align:center}
.toc{columns:2;column-gap:36px}
.toc div{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--hair);break-inside:avoid;font-size:10.5px}
.toc div span:first-child{width:20px;color:var(--tblue);font-weight:600}
.toc div span:nth-child(2){flex:1;color:var(--navy);font-weight:500}
.toc div span:last-child{color:var(--muted)}
</style>
</head>
<body>
<!--PAGES-->
<script>
const pages=[...document.querySelectorAll('.page')];
pages.forEach((pg,i)=>{
  const n=String(i+1).padStart(2,'0'), cat=pg.dataset.cat||'', title=pg.dataset.title||'';
  const inner=pg.innerHTML;
  pg.innerHTML=`<div class="ph"><b>${n} — ${cat}</b><i></i><span>${pg.dataset.right||'Lokale Unternehmen stärker machen'}</span></div><div class="pc">${inner}</div><div class="pf"><span>Markentrix · Corporate Identity 2026 · v2.0</span><span>${n} · ${title}</span></div>`;
});
const toc=document.querySelector('.toc');
if(toc) toc.innerHTML=pages.slice(2).map((pg,i)=>`<div><span>${String(i+3).padStart(2,'0')}</span><span>${pg.dataset.title}</span><span>${pg.dataset.cat}</span></div>`).join('');
</script>
</body>
</html>
