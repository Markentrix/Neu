<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Markentrix · Markenhandbuch 2026 · Version 3.0</title>
<style>
@font-face{font-family:'Archivo';font-weight:600;src:url(fonts/archivo-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-weight:700;src:url(fonts/archivo-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-weight:800;src:url(fonts/archivo-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:400;src:url(fonts/source-sans-3-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:600;src:url(fonts/source-sans-3-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:700;src:url(fonts/source-sans-3-latin-700-normal.woff2) format('woff2')}
:root{--kreide:#F7F4EE;--tiefsee:#0C2128;--pfau:#045268;--leinen:#EAE2D3;--kupfer:#C67432;--kupferd:#964F08;--pfauh:#62B2D0;--kupferh:#F1A268;--nebel:#E1F0F6;--weiss:#fff;--neben:#4E5C5F;--fehler:#B3261E;
--fh:'Archivo',sans-serif;--fb:'Source Sans 3',sans-serif}
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--fb);font-size:11.6px;line-height:1.45;color:var(--tiefsee);-webkit-print-color-adjust:exact;print-color-adjust:exact;font-feature-settings:'tnum' 1}
.page{width:794px;height:1123px;padding:44px 60px 0;position:relative;background:var(--kreide);overflow:hidden;page-break-after:always;break-after:page}
.ph{display:flex;align-items:center;gap:16px;font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--neben);height:14px}
.ph i{flex:1;height:1px;background:var(--leinen)}
.ph b{font-weight:600}
.ph:after{content:'';width:36px;height:3px;background:var(--kupfer)}
.pf{position:absolute;left:60px;right:60px;bottom:28px;padding-top:10px;border-top:1px solid var(--leinen);display:flex;justify-content:space-between;font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--neben)}
.pc{padding-top:34px}
h1{font-family:var(--fh);font-weight:800;font-size:35px;line-height:1.06;letter-spacing:-.025em;color:var(--tiefsee);margin:0 0 10px}
h2{font-family:var(--fh);font-weight:700;font-size:15.5px;line-height:1.25;letter-spacing:-.015em;color:var(--tiefsee);margin:0 0 8px}
h3{font-family:var(--fh);font-weight:700;font-size:12px;line-height:1.3;letter-spacing:-.01em;color:var(--tiefsee);margin:0 0 4px}
.lead{font-size:14px;line-height:1.45;max-width:610px;margin:0 0 22px}
p{margin:0 0 6px}
.mk{box-shadow:inset 0 -.14em 0 var(--kupfer)}
.card{background:#fff;border:1px solid var(--leinen);border-radius:8px;padding:15px 17px}
.card.soft{background:var(--leinen)}
.card.dk{background:var(--tiefsee);border-color:var(--tiefsee);color:var(--kreide)}
.card.dk h2,.card.dk h3,.card.dk b{color:#fff}
.g2,.g3,.g4,.g5{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb0{margin-bottom:0}
.lab{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--neben);margin:0 0 8px;display:block}
.lab.b{color:var(--pfau)}
ul{margin:0;padding:0;list-style:none}
ul li{position:relative;padding-left:13px;margin-bottom:4.5px}
ul li:before{content:'';position:absolute;left:0;top:.5em;width:5px;height:5px;background:var(--pfau)}
ul.no li:before{content:'×';background:none;color:var(--fehler);font-weight:700;top:-.1em;width:auto;height:auto;font-size:13px}
ul.yes li:before{content:'✓';background:none;color:var(--pfau);font-weight:700;top:-.05em;width:auto;height:auto;font-size:10.5px}
ul.tight li{margin-bottom:2.5px}
table.t{width:100%;border-collapse:collapse;font-size:10.8px;line-height:1.35}
table.t th{text-align:left;font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--neben);padding:0 8px 6px 0;border-bottom:1px solid var(--leinen);vertical-align:bottom}
table.t td{padding:6px 8px 6px 0;border-bottom:1px solid var(--leinen);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t.tt td{padding:4px 8px 4px 0}
b{font-weight:700}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.5px}
.offen{display:inline-block;font-size:8px;font-weight:700;letter-spacing:.08em;padding:1.5px 5px;border-radius:3px;vertical-align:.12em;margin-left:5px;background:var(--kupfer);color:var(--tiefsee)}
.sw{height:54px;border-radius:6px;border:1px solid rgba(12,33,40,.08);margin-bottom:8px}
.small{font-size:10px;color:var(--neben);line-height:1.4}
.num{font-family:var(--fh);font-weight:800;font-size:10.5px;color:var(--pfau);letter-spacing:.02em}
.ok{color:var(--pfau);font-weight:700}.bad{color:var(--fehler);font-weight:700}
.stage{background:#fff;border:1px solid var(--leinen);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.stage.kr{background:var(--kreide)}
.stage.dk{background:var(--tiefsee);border-color:var(--tiefsee)}
.cap{font-size:10px;color:var(--neben);margin-top:6px}
.cap b{color:var(--tiefsee)}
.btn{display:inline-flex;align-items:center;white-space:nowrap;height:34px;padding:0 15px;border-radius:4px;font-weight:600;font-size:12px;color:#fff;background:var(--pfau)}
.btn.sec{background:#fff;border:1px solid var(--tiefsee);color:var(--tiefsee)}
.btn.ter{background:none;padding:0;color:var(--pfau)}
.prompt{background:var(--tiefsee);color:#EAF0F1;border-radius:8px;padding:13px 15px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.7px;line-height:1.55;white-space:pre-wrap}
.prompt em{color:var(--kupferh);font-style:normal}
.bar{height:9px;background:var(--leinen);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0}
.x{position:relative}
.x:after{content:'×';position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;background:var(--fehler);color:#fff;font-size:12px;font-weight:700;line-height:15px;text-align:center}
.toc{columns:2;column-gap:36px}
.toc div{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--leinen);break-inside:avoid;font-size:11px}
.toc div span:first-child{width:20px;color:var(--pfau);font-weight:700}
.toc div span:nth-child(2){flex:1;font-weight:600}
.toc div span:last-child{color:var(--neben)}
.hl{font-family:var(--fh);font-weight:800;letter-spacing:-.025em;line-height:1.05;color:var(--tiefsee)}
</style>
</head>
<body>
<!--PAGES-->
<script>
const pages=[...document.querySelectorAll('.page')];
pages.forEach((pg,i)=>{
  const n=String(i+1).padStart(2,'0'), cat=pg.dataset.cat||'', title=pg.dataset.title||'';
  const inner=pg.innerHTML;
  pg.innerHTML=`<div class="ph"><b>${n} — ${cat}</b><i></i><span>${pg.dataset.right||'Mehr Anfragen. Weniger Aufwand.'}</span></div><div class="pc">${inner}</div><div class="pf"><span>Markentrix · Markenhandbuch 2026 · Version 3.0</span><span>${n} · ${title}</span></div>`;
});
const toc=document.querySelector('.toc');
if(toc) toc.innerHTML=pages.slice(2).map((pg,i)=>`<div><span>${String(i+3).padStart(2,'0')}</span><span>${pg.dataset.title}</span><span>${pg.dataset.cat}</span></div>`).join('');
document.querySelectorAll('[data-s]').forEach(e=>{const p=pages.findIndex(pg=>pg.dataset.key===e.dataset.s);e.textContent=p<0?'??':String(p+1)});
</script>
</body>
</html>
