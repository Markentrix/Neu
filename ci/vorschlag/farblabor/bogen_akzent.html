<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Inter';font-weight:600;src:url(../../src/fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:'Archivo';font-weight:800;src:url(../fonts/archivo-latin-800-normal.woff2)}
@font-face{font-family:'Source Sans 3';font-weight:400;src:url(../fonts/source-sans-3-latin-400-normal.woff2)}
@font-face{font-family:'Source Sans 3';font-weight:600;src:url(../fonts/source-sans-3-latin-600-normal.woff2)}
*{box-sizing:border-box}body{margin:0;padding:18px;background:#fff;font-family:Inter;font-size:11px;width:1500px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 18px}
.t{font-size:13px;font-weight:600;margin-bottom:2px}.i{font-size:10px;color:#666;margin-bottom:6px}
.m{border-radius:8px;position:relative;overflow:hidden;font-family:'Source Sans 3'}.hl{font-family:Archivo;font-weight:800;letter-spacing:-.025em;line-height:1.04}
</style></head><body><div class="g" id="g"></div><script>
const K=[{"name": "1 Zinnober dunkel", "main": "#045268", "acc": "#B0431F", "ink": "#1E1C19", "paper": "#F4EFE6", "surf": "#E6DCCA", "mainDk": "#65A9C3", "accDk": "#F69273", "accOn": "#FFFFFF", "info": "Akzent auf Papier 5.0 \u00b7 Text auf Akzent 5.7 \u00b7 Haupt auf Papier 7.6"}, {"name": "2 Siena dunkel", "main": "#045268", "acc": "#A44D1A", "ink": "#1E1C19", "paper": "#F4EFE6", "surf": "#E6DCCA", "mainDk": "#65A9C3", "accDk": "#F39465", "accOn": "#FFFFFF", "info": "Akzent auf Papier 5.0 \u00b7 Text auf Akzent 5.7 \u00b7 Haupt auf Papier 7.6"}, {"name": "3 Kupfer dunkel", "main": "#045268", "acc": "#9A5519", "ink": "#1E1C19", "paper": "#F4EFE6", "surf": "#E6DCCA", "mainDk": "#65A9C3", "accDk": "#E99A60", "accOn": "#FFFFFF", "info": "Akzent auf Papier 5.0 \u00b7 Text auf Akzent 5.7 \u00b7 Haupt auf Papier 7.6"}, {"name": "4 Bernstein dunkel", "main": "#045268", "acc": "#905B06", "ink": "#1E1C19", "paper": "#F4EFE6", "surf": "#E6DCCA", "mainDk": "#65A9C3", "accDk": "#DDA057", "accOn": "#FFFFFF", "info": "Akzent auf Papier 5.0 \u00b7 Text auf Akzent 5.7 \u00b7 Haupt auf Papier 7.6"}, {"name": "5 Kupfer mittel", "main": "#045268", "acc": "#C4723B", "ink": "#1E1C19", "paper": "#F4EFE6", "surf": "#E6DCCA", "mainDk": "#65A9C3", "accDk": "#F0975D", "accOn": "#1E1C19", "info": "Akzent auf Papier 3.2 \u00b7 Text auf Akzent 4.7 \u00b7 Haupt auf Papier 7.6"}, {"name": "6 Bernstein mittel", "main": "#045268", "acc": "#BA7823", "ink": "#1E1C19", "paper": "#F4EFE6", "surf": "#E6DCCA", "mainDk": "#65A9C3", "accDk": "#E59D4A", "accOn": "#1E1C19", "info": "Akzent auf Papier 3.2 \u00b7 Text auf Akzent 4.7 \u00b7 Haupt auf Papier 7.6"}, {"name": "7 Messing mittel", "main": "#045268", "acc": "#A78124", "ink": "#1E1C19", "paper": "#F4EFE6", "surf": "#E6DCCA", "mainDk": "#65A9C3", "accDk": "#D0A749", "accOn": "#1E1C19", "info": "Akzent auf Papier 3.2 \u00b7 Text auf Akzent 4.7 \u00b7 Haupt auf Papier 7.6"}, {"name": "8 Koralle mittel", "main": "#045268", "acc": "#D2684E", "ink": "#1E1C19", "paper": "#F4EFE6", "surf": "#E6DCCA", "mainDk": "#65A9C3", "accDk": "#F79177", "accOn": "#1E1C19", "info": "Akzent auf Papier 3.1 \u00b7 Text auf Akzent 4.7 \u00b7 Haupt auf Papier 7.6"}];
const mark=(m,a,w)=>`<svg viewBox="0 0 522 447" style="width:${w}px;flex:none;display:block"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="${a}" stroke-width="54" d="M414 107.5 495 27M415 27h80v80.5"/><path stroke="${m}" stroke-width="82" d="M41 406V107.5L227.5 277.5 414 107.5V406"/></g></svg>`;
const logo=(h,m,a,c)=>`<div style="display:flex;align-items:flex-end;gap:${h*.36}px">${mark(m,a,h*1.168)}<span style="font-family:Archivo;font-weight:800;font-size:${h*.86}px;line-height:1;margin-bottom:${-h*.115}px;letter-spacing:-.02em;color:${c}">Markentrix</span></div>`;
const arrow=(c,w)=>`<svg viewBox="0 0 240 90" style="width:${w}px;display:block" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 84C80 82 150 62 222 12"/><path d="M194 10h30v30"/></svg>`;
document.getElementById('g').innerHTML=K.map(v=>`<div><div class="t">${v.name} &nbsp; <span style="font-weight:400">${v.main} · ${v.acc} · ${v.surf} · Tinte ${v.ink}</span></div><div class="i">${v.info}</div>
<div style="display:grid;grid-template-columns:1.75fr 1fr;gap:8px">
 <div class="m" style="background:${v.paper};color:${v.ink};padding:14px 18px;height:226px;border:1px solid rgba(0,0,0,.08)">
  <div style="display:flex;align-items:center;gap:12px;font-size:8px;font-weight:600;margin-bottom:18px">${logo(13,v.ink,v.main,v.ink)}<span style="flex:1"></span><span>Leistungen</span><span>Preise</span><span>Kontakt</span><span style="background:${v.main};color:#fff;padding:5px 9px;border-radius:3px">Termin buchen</span></div>
  <div class="hl" style="font-size:33px;margin-bottom:8px">Websites, die<br><span style="box-shadow:inset 0 -.14em 0 ${v.acc}">Anfragen</span> bringen.</div>
  <div style="font-size:11.5px;max-width:270px;margin-bottom:11px;opacity:.85">Für Betriebe, die mehr Kunden wollen und keine Zeit für Technik haben.</div>
  <div style="display:flex;gap:8px;align-items:center"><span style="background:${v.main};color:#fff;font-weight:600;font-size:9.5px;padding:8px 12px;border-radius:4px">Website-Check starten</span><span style="border:1px solid ${v.ink};font-weight:600;font-size:9.5px;padding:7px 12px;border-radius:4px">Erstgespräch buchen</span><span style="color:${v.main};font-weight:600;font-size:9.5px">Alle Referenzen →</span></div>
  <div style="position:absolute;right:18px;bottom:16px">${arrow(v.main,90)}</div></div>
 <div class="m" style="background:${v.ink};color:${v.paper};padding:16px;height:226px">
  <div class="hl" style="font-size:25px;margin-bottom:8px">Mehr Anfragen.<br><span style="color:${v.mainDk}">Weniger Aufwand.</span></div>
  <div style="font-size:10.5px;max-width:160px;opacity:.85">Ihre Website arbeitet, während Sie im Laden stehen.</div>
  <span style="position:absolute;right:14px;top:14px;background:${v.accDk};color:${v.ink};font-weight:600;font-size:7.5px;padding:3px 7px;border-radius:3px;font-family:Inter">NEU</span>
  <div style="position:absolute;left:16px;bottom:15px">${logo(14,v.paper,v.mainDk,v.paper)}</div><div style="position:absolute;right:14px;bottom:15px;width:44px;height:4px;background:${v.accDk}"></div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:8px">
 <div class="m" style="background:${v.surf};padding:11px 13px;height:92px;color:${v.ink}"><div style="font-family:Inter;font-size:7.5px;font-weight:600;letter-spacing:.08em;color:${v.main}">SO LÄUFT ES AB</div><div class="hl" style="font-size:14px;margin:4px 0 3px">In 5 bis 15 Werktagen live.</div><div style="font-size:9px;line-height:1.3;opacity:.85">Rund 60 Minuten für Briefing und Freigabe.</div></div>
 <div class="m" style="background:#FFFDF8;border:1px solid rgba(0,0,0,.08);padding:11px 13px;height:92px;color:${v.ink}"><span style="position:absolute;right:10px;top:10px;background:${v.acc};color:${v.accOn};font-family:Inter;font-weight:600;font-size:7.5px;padding:3px 7px;border-radius:3px">Nur bis 30.11.</span><div class="hl" style="font-size:24px;margin-top:14px">599 €</div><span style="display:inline-block;margin-top:4px;background:${v.main};color:#fff;font-weight:600;font-size:8px;padding:4px 9px;border-radius:3px">Angebot sichern</span></div>
 <div class="m" style="background:#FFFDF8;border:1px solid rgba(0,0,0,.08);padding:11px 13px;height:92px"><svg viewBox="0 0 170 64" style="width:100%;height:100%"><g fill="${v.main}"><rect x="2" y="40" width="26" height="20" rx="2"/><rect x="36" y="32" width="26" height="28" rx="2"/><rect x="70" y="26" width="26" height="34" rx="2"/><rect x="104" y="16" width="26" height="44" rx="2"/></g><rect x="138" y="4" width="26" height="56" rx="2" fill="${v.acc}"/></svg></div>
 <div class="m" style="background:${v.main};padding:11px 13px;height:92px;color:#fff"><div class="hl" style="font-size:14px;margin-bottom:4px">Ein Ansprechpartner.</div><div style="font-size:9px;line-height:1.3;opacity:.9">Kein Ticketsystem, kein Call-Center.</div><div style="position:absolute;left:13px;bottom:11px;display:flex;gap:4px"><i style="width:14px;height:14px;background:${v.acc};border-radius:2px"></i><i style="width:14px;height:14px;background:${v.surf};border-radius:2px"></i><i style="width:14px;height:14px;background:${v.ink};border-radius:2px"></i><i style="width:14px;height:14px;background:${v.paper};border-radius:2px"></i></div></div>
</div></div>`).join('');
</script></body></html>
