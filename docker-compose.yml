services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - BASE_URL=https://${DOMAIN}
    volumes:
      - shopdata:/data
    expose: ["3000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  shopdata:
  caddy_data:
  caddy_config:
