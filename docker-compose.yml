# AJ Atelier – läuft als App hinter dem gemeinsamen Caddy des Markentrix-Servers
# (/opt/neu/server). Kein eigener Port nach außen: Caddy erreicht den Container
# über das Docker-Netz "web" unter dem Namen "aj-atelier".
#
#   cd /srv/apps/aj-atelier && docker compose up -d --build
services:
  web:
    build: .
    container_name: aj-atelier
    restart: unless-stopped
    volumes:
      - ./app/config.local.php:/var/www/site/app/config.local.php:ro
      - bookings:/var/www/site/app/data        # Termine bleiben bei Updates erhalten
    networks: [web]

volumes:
  bookings:

networks:
  web:
    external: true
