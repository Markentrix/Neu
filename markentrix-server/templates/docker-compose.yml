# Markentrix Server-Stack: n8n, Server-Dashboard und (optional) Caddy.
name: markentrix

networks:
  net:
    name: markentrix_net

volumes:
  n8n_data:
  n8n_db:
  mk_db:
  caddy_data:
  caddy_config:
  portal_uploads:

services:
  # Nur lesender Zugriff auf Docker, damit das Dashboard die Dienste anzeigen kann.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: mk-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [net]

  # Eigene Datenbank für Kunden-Portal und Admin (nur intern erreichbar, kein Port nach außen).
  mk-db:
    image: postgres:16-alpine
    container_name: mk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: markentrix
      POSTGRES_DB: markentrix
      POSTGRES_PASSWORD: ${MK_DB_PASSWORD}
    volumes:
      - mk_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markentrix -d markentrix"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [net]

  n8n-db:
    image: postgres:16-alpine
    container_name: mk-n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [net]

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: mk-n8n
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [net]

  panel:
    build: ./panel
    image: markentrix-panel:local
    container_name: mk-panel
    restart: unless-stopped
    depends_on: [socket-proxy]
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      PANEL_PASSWORD: ${PANEL_PASSWORD}
      DOMAIN: ${DOMAIN}
      DOCKER_HOST: http://socket-proxy:2375
      SITES_ROOT: /srv/sites
      BACKUP_DIR: /backups
    volumes:
      - /srv/sites:/srv/sites:ro
      - ./backups:/backups:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [net]

  # Kunden-Portal und Admin-Bereich: https://portal.<domain>
  portal:
    build: ./portal
    image: markentrix-portal:local
    container_name: mk-portal
    restart: unless-stopped
    depends_on:
      mk-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8000"
    environment:
      DATABASE_URL: postgresql://mk_app:${MK_APP_PASSWORD}@mk-db:5432/markentrix
      PORTAL_BASE_URL: https://portal.${DOMAIN}
      PORTAL_COOKIE_SECURE: "1"
      CHAT_WEBHOOK_URL: ${CHAT_WEBHOOK_URL:-}
      CHAT_WEBHOOK_SECRET: ${CHAT_WEBHOOK_SECRET:-}
    volumes:
      - portal_uploads:/data
      - /srv/sites/live:/srv/sites/live
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [net]

  # Wird nur gestartet, wenn auf dem Server noch kein Caddy läuft (Profil "own-caddy").
  caddy:
    image: caddy:2
    container_name: mk-caddy
    profiles: ["own-caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro
      - /srv/sites:/srv/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [net]
