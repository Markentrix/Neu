# Markentrix · nginx-Konfiguration für Hetzner · Stand 14.10.2026
# Voraussetzung für die Formulare: PHP-FPM (z. B. apt install php8.2-fpm) und ein konfigurierter Mailversand (sendmail/postfix oder msmtp).
# Deploy: rsync -a --delete dist/ server:/var/www/markentrix/
# HINWEIS: Testadresse (z. B. server.markentrix.de) per eigenem server-Block mit
#   add_header X-Robots-Tag "noindex, nofollow" always;
# ausliefern oder nach dem Umzug abschalten.
server {
  listen 80;
  listen [::]:80;
  server_name markentrix.de www.markentrix.de;
  return 301 https://markentrix.de$request_uri;
}
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.markentrix.de;
  ssl_certificate     /etc/letsencrypt/live/markentrix.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/markentrix.de/privkey.pem;
  return 301 https://markentrix.de$request_uri;
}
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name markentrix.de;
  root /var/www/markentrix;
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/markentrix.de/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/markentrix.de/privkey.pem;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=()" always;
  # HSTS mit includeSubDomains + preload: ALLE Subdomains (auch Kundenportal auf Hetzner) müssen dauerhaft HTTPS haben.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://*.googletagmanager.com https://tracker.metricool.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://tracker.metricool.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://tracker.metricool.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Sprechende URLs: /preise -> preise.html ; /preise.html -> 301 /preise
  location / {
    if ($request_uri ~ ^/(.+)\.html$) { return 301 /$1; }
    try_files $uri $uri.html $uri/ =404;
  }

  # Formular-Endpunkt (Kontaktformular, Potenzial-Check) → dist/api/anfrage.php
  location = /api/anfrage.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # Pfad an die installierte PHP-Version anpassen
    fastcgi_read_timeout 15s;
  }
  location ~ \.php$ { return 404; }               # kein anderes PHP ausführen
  location ~ /(anfragen\.log|\.git) { deny all; }  # Protokoll liegt eine Ebene über dem Webroot, hier nur zur Sicherheit

  # Alte Dateipfade
  location = "/Markentrix Website.dc.html" { return 301 /; }
  location = "/Leistungen-KI-Automatisierung.dc.html" { return 301 /leistungen/ki-automatisierung; }
  location = "/Leistungen-Marketing.dc.html" { return 301 /leistungen/marketing; }
  location = "/Leistungen-Webdesign.dc.html" { return 301 /leistungen/webdesign; }
  location = "/Preise.dc.html" { return 301 /preise; }
  location = "/Prozess.dc.html" { return 301 /prozess; }
  location = "/Ueber-uns.dc.html" { return 301 /ueber-uns; }
  location = "/Referenzen.dc.html" { return 301 /referenzen; }
  location = "/FAQ.dc.html" { return 301 /faq; }
  location = "/ROI-Rechner.dc.html" { return 301 /roi-rechner; }
  location = "/Kontakt.dc.html" { return 301 /kontakt; }
  location = "/Impressum.dc.html" { return 301 /impressum; }
  location = "/Datenschutz.dc.html" { return 301 /datenschutz; }
  location = "/AGB.dc.html" { return 301 /agb; }
  location = "/KI-Checkliste Markentrix.dc.html" { return 301 /ki-checkliste; }
  location = "/KI-Marketing-Celle.dc.html" { return 301 /ki-marketing-celle; }
  location = "/KI-Marketing-Hannover.dc.html" { return 301 /ki-marketing-hannover; }
  location = "/KI-Marketing-Braunschweig.dc.html" { return 301 /ki-marketing-braunschweig; }
  location = "/KI-Marketing-Gifhorn.dc.html" { return 301 /ki-marketing-gifhorn; }
  location = /kunden-dashboard { return 301 https://markentrix.netlify.app/; }
  location = /Kunden-Dashboard.dc.html { return 301 https://markentrix.netlify.app/; }

  location ~* ^/(assets|fonts)/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location ~* ^/img/ { expires 30d; try_files $uri =404; }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
