<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(archivo-var.woff2);font-weight:300 800;font-stretch:100% 106%}
@font-face{font-family:A;src:url(inter-amp.woff2);unicode-range:U+0026}
@font-face{font-family:N;src:url(newsreader-italic.woff2);font-style:italic;font-weight:500}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#1e2229;font-family:A;color:#f4f6f9;position:relative}
.foto{position:absolute;inset:0 0 0 380px;background:url(foto.jpg) 50% 45%/cover}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#1e2229 0%,rgba(30,34,41,.9) 30%,rgba(30,34,41,.45) 62%,rgba(30,34,41,0) 100%)}
.txt{position:absolute;left:72px;top:64px;bottom:60px;width:640px;display:flex;flex-direction:column}
.logo{height:72px;width:auto;align-self:flex-start}
.eb{margin-top:auto;font-size:19px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;color:#5b9be8;display:flex;align-items:center;gap:14px}
.eb::before{content:"";width:30px;height:2px;background:#5b9be8}
h1{margin-top:18px;font-size:64px;line-height:1.02;font-weight:650;font-stretch:104%;letter-spacing:-.03em}
h1 em{display:block;font-family:N;font-style:italic;font-weight:500;color:#5b9be8;letter-spacing:-.01em;font-size:1.02em;margin-top:6px}
.meta{margin-top:30px;font-size:21px;color:#c3c9d3;font-weight:500}
.bar{position:absolute;left:0;top:0;bottom:0;width:10px;background:#1c4f9c}
</style></head><body><div class="foto"></div><div class="bar"></div><div class="txt">
<img class="logo" src="logo.svg" alt="">
<p class="eb">Celle · Lachtehäuser Straße 1</p>
<h1>Fahrzeugaufbereitung in Celle.<em>Mit Liebe zum Detail.</em></h1>
<p class="meta">Handarbeit · C²Coating Excellence Partner · Festpreis vorab</p>
</div></body></html>
