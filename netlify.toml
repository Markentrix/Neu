# Markentrix — Netlify-Konfiguration · Stand 28.09.2026
# Veröffentlicht wird ausschließlich der Build-Ordner dist/ (statisches HTML, kein CDN).
# Netlify liefert /preise automatisch aus dist/preise.html aus.

[build]
  publish = "dist"

# ── Alte Dateipfade dauerhaft auf die sprechenden URLs umleiten ──
